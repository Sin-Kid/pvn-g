name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Validate and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dev tools
        run: npm ci

      - name: Validate HTML, scripts, links and headers
        run: npm run check

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke test in a real browser
        run: npm test
