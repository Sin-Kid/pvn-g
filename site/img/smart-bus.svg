  <text x="216" y="324" font-size="15" fill="#E3EAE5" text-anchor="middle">RFID</text>
  <path d="M114 290V262M216 290V262" stroke="#2E5A47" stroke-width="2"/>
  <text x="70" y="390" font-size="12" fill="#7FA190">position + tap-in / tap-out</text>

  <!-- uplink -->
  <path d="M292 260H372" stroke="#FFC24D" stroke-width="3" fill="none" marker-end="url(#a)"/>
