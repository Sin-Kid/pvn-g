  <text x="400" y="214" font-size="20" fill="#E3EAE5">PostgreSQL</text>
  <text x="400" y="246" font-size="13" fill="#7FA190">realtime subscriptions</text>
  <rect x="400" y="268" width="200" height="34" rx="6" fill="#0A1712" stroke="#2E5A47"/>
