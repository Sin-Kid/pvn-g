  <rect x="70" y="150" width="190" height="96" rx="8" fill="#151819" stroke="#2C3235"/>
  <g fill="#D9B05A"><rect x="84" y="140" width="8" height="10"/><rect x="104" y="140" width="8" height="10"/><rect x="124" y="140" width="8" height="10"/><rect x="144" y="140" width="8" height="10"/><rect x="164" y="140" width="8" height="10"/><rect x="184" y="140" width="8" height="10"/><rect x="204" y="140" width="8" height="10"/><rect x="224" y="140" width="8" height="10"/>
    <rect x="84" y="246" width="8" height="10"/><rect x="104" y="246" width="8" height="10"/><rect x="124" y="246" width="8" height="10"/><rect x="144" y="246" width="8" height="10"/><rect x="164" y="246" width="8" height="10"/><rect x="184" y="246" width="8" height="10"/><rect x="204" y="246" width="8" height="10"/><rect x="224" y="246" width="8" height="10"/></g>
  <text x="165" y="196" font-size="24" fill="#E3EAE5" text-anchor="middle">ESP32</text>
