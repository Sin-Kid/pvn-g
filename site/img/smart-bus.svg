  <path d="M622 220H700V160H742" stroke="#FFC24D" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <path d="M622 300H700V362H742" stroke="#FFC24D" stroke-width="3" fill="none" marker-end="url(#a)"/>
